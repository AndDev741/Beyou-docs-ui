# Tells a locale-prefixed URL from a bare one, so `/blog` can be sent to
# `/en/blog` instead of 404ing. Everything that is not a page -- hashed assets,
# font files, and the root-level files like /robots.txt -- has to be excluded or
# it would be redirected into a locale directory that does not contain it.
map $uri $needs_locale {
    default              1;
    "~^/(en|pt)(/|$)"    0;
    "~^/assets/"         0;
    # `/` is served, not redirected: index.html picks a locale from the
    # visitor's own Accept-Language instead of assuming English for everyone.
    "~^/$"               0;
    # Any root-level file with an extension: /favicon.svg, /robots.txt,
    # /sitemap.xml, /llms.txt, /og-cover.png.
    "~^/[^/]+\.[^/]+$"   0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects go out as paths, not as full URLs. nginx builds an absolute
    # Location from $host and the listen port, which behind the Cloudflare
    # tunnel is this container's own 127.0.0.1:80 -- it would hand visitors a
    # Location pointing at their own machine.
    absolute_redirect off;

    # The prerendered HTML is the whole point of this image, and it is text.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml text/xml;

    location / {
        include /etc/nginx/security-headers.inc;

        # HTML carries no fingerprint, so caching it is what makes a deploy
        # invisible until the cache expires. This is the pages' only cache
        # header: matching on `\.html$` does not work, because the canonical
        # URLs have no extension -- the .html is resolved internally by
        # try_files and never appears in the request.
        add_header Cache-Control "no-cache, must-revalidate" always;

        # `if` is only safe in a location for `return`, which is what this is.
        if ($needs_locale) {
            return 302 /en$uri;
        }

        # $uri/index.html is checked BEFORE $uri/ on purpose. Matching the
        # directory first makes nginx 301 to the trailing-slash form, so
        # /en/blog/foo would bounce to /en/blog/foo/ -- while every canonical,
        # hreflang and sitemap entry names the slash-less URL. A canonical that
        # points at a redirect is a canonical search engines discard. Naming the
        # index file directly serves the same page with no redirect at all.
        #
        # Falling back to =404 rather than to /index.html is also deliberate:
        # serving the SPA shell with a 200 for every unknown URL is a soft 404,
        # which invites search engines to index unlimited typo'd URLs as
        # duplicates of the same page.
        try_files $uri $uri/index.html =404;
    }

    # A real 404 status, with the SPA still booting so the visitor gets the
    # styled NotFound page rather than nginx's default.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Same-origin API. The docs pages fetch /api/v1/docs/** from their own
    # origin, so nothing has to be added to the backend's CORS_ALLOWED_PATTERN
    # and no preflight is needed. The backend's servlet context-path is already
    # /api/v1, so the prefix is passed through rather than stripped.
    location ^~ /api/v1/ {
        proxy_pass http://backend:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One page, one URL. try_files resolves /en/blog and /en/blog/ to the same
    # index.html, so every page answered at two addresses. The canonical tag
    # already names the slash-less form, but leaving both live splits crawl
    # budget and lets either one collect links. `/` itself cannot match: the
    # pattern needs at least one character before the trailing slash.
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    # Source maps must never be reachable: serving one publishes the entire
    # application source. Must precede the static-asset rule below, which would
    # otherwise match the `.js` inside `.js.map`.
    location ~* \.map$ {
        return 404;
    }

    # Vite fingerprints these, so a new deploy means new filenames -- they can be
    # cached forever without ever going stale.
    #
    # `expires` is deliberately not used anywhere below: it emits a
    # Cache-Control of its own, so pairing it with an add_header sent two
    # Cache-Control lines per response and left it to the client which to
    # believe. add_header alone carries the full directive.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(favicon\.svg|og-cover\.png|placeholder\.svg)$ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Regenerated on every build; a stale copy would advertise pages that moved.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
