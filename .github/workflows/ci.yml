name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Content lives in beyou-arch-design, not here. The backend imports it and the
  # prerenderer reads it back through the API at build time, so a docs edit
  # changes the published site without changing a line of this repo. That repo
  # dispatches this event after its import runs, which is what turns a content
  # commit into a rebuilt and redeployed site.
  repository_dispatch:
    types: [docs-content-updated]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # All three are hard gates. They only became gateable once the template
      # leftovers were removed -- lint used to exit non-zero with 17 errors,
      # tsc with 15, and four test files imported a RoleContext that no longer
      # existed. A pipeline that is red from its first run teaches everyone to
      # ignore it, so nothing here is allowed to fail softly.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: npm test

      # `build:spa`, not `build`: this job only needs to prove the bundle
      # compiles. The full build also prerenders, which spends about three
      # minutes pulling every topic from the live docs API -- worth it once, in
      # the job that actually deploys, not on every pull request.
      - name: Build
        run: npm run build:spa

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Wrangler 4 needs Node 22; the build is happy on it too.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SITE_URL is baked into every canonical, hreflang, og:url and sitemap
      # entry, so it has to be the real public origin.
      #
      # PRERENDER_API_URL is read by scripts/prerender.mts and must be reachable
      # from the runner. The step takes roughly three minutes: the docs
      # endpoints allow 30 requests a minute per IP and a full prerender is ~74,
      # so the script paces itself under that limit rather than being rejected.
      #
      # VITE_BACKEND_URL points the pages' own API calls at the public API.
      # Cloudflare serves files only, so the same-origin /api/v1/ the nginx
      # image proxies does not exist there; the backend's CORS_ALLOWED_PATTERN
      # has to list the docs origin instead.
      - name: Build and prerender
        run: npm run build
        env:
          SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://docs.beyouweb.com' }}
          VITE_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://docs.beyouweb.com' }}
          PRERENDER_API_URL: ${{ vars.DOCS_PRERENDER_API_URL || 'https://api.beyouweb.com/api/v1' }}
          VITE_BACKEND_URL: ${{ vars.DOCS_BACKEND_URL || 'https://api.beyouweb.com/api/v1' }}
          # Same contract as the app: build-time inline; a missing key ships
          # the site with analytics off. The Beyou PostHog project is
          # EU-hosted, so the host variable must be set alongside the key.
          VITE_POSTHOG_KEY: ${{ vars.PROD_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.PROD_POSTHOG_HOST }}

      # Uploads dist/ as the static assets of the `beyou-docs` Worker
      # (wrangler.jsonc) and attaches docs.beyouweb.com to it. The token needs
      # Workers Admin on the account (the first deploy creates the Worker) and
      # Workers Routes Write on the beyouweb.com zone. Wrangler is pinned here
      # rather than added to the lockfile, so the verify job keeps its install
      # time.
      - name: Deploy
        run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
