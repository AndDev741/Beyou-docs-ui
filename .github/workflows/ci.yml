name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Content lives in beyou-arch-design, not here. The backend imports it and the
  # prerenderer reads it back through the API at build time, so a docs edit
  # changes the published site without changing a line of this repo. That repo
  # dispatches this event after its import runs, which is what turns a content
  # commit into a rebuilt image.
  repository_dispatch:
    types: [docs-content-updated]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reported, not enforced. `npm run lint` currently exits non-zero on main
      # with 17 pre-existing errors -- mostly no-explicit-any in the OpenAPI
      # helpers, plus a require() in tailwind.config.ts. Gating on it would mean
      # a pipeline that is red from its first run, which teaches everyone to
      # ignore it. Clear those and this should become a hard gate.
      #
      # `npm test` is left out for the same reason and is worse: four test files
      # import @/context/RoleContext, which no longer exists, and one reads a
      # sibling checkout of beyou-arch-design off the filesystem.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `build:spa`, not `build`: this job only needs to prove the bundle
      # compiles. The full build also prerenders, which spends about three
      # minutes pulling every topic from the live docs API -- worth it once, in
      # the job that actually publishes an image, not on every pull request.
      - name: Build
        run: npm run build:spa

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SITE_URL is baked into every canonical, hreflang, og:url and sitemap
      # entry, so it has to be the real public origin.
      #
      # PRERENDER_API_URL is read by scripts/prerender.mts and must be reachable
      # from the runner, which is why it is the public API host and not the
      # internal container name. The step takes roughly three minutes: the docs
      # endpoints allow 30 requests a minute per IP and a full prerender is ~74,
      # so the script paces itself under that limit rather than being rejected.
      - name: Build and push docs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          build-args: |
            SITE_URL=${{ vars.DOCS_SITE_URL || 'https://docs.beyouweb.com' }}
            PRERENDER_API_URL=${{ vars.DOCS_PRERENDER_API_URL || 'https://api.beyouweb.com/api/v1' }}
          tags: |
            ghcr.io/anddev741/beyou-docs:latest
            ghcr.io/anddev741/beyou-docs:sha-${{ env.SHORT_SHA }}
