<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B1220" />

    <!--
      Fonts are self-hosted and imported from src/main.tsx; the three
      fonts.googleapis.com stylesheets that used to sit here were render-blocking
      requests to a third-party origin.

      This file is only the shell. scripts/prerender.mts replaces the title,
      description and social tags below with per-page values and writes one HTML
      file per route, so what a crawler actually receives is never this generic
      copy. These stay as the fallback for `npm run build:spa`, which skips
      prerendering.
    -->
    <title>Beyou Docs</title>
    <meta
      name="description"
      content="How the Beyou habit-tracking app is built: system architecture, API contracts, self-hosted infrastructure and the engineering decisions behind them."
    />

    <meta property="og:site_name" content="Beyou Docs" />
    <meta property="og:title" content="Beyou Docs" />
    <meta
      property="og:description"
      content="How the Beyou habit-tracking app is built: system architecture, API contracts, self-hosted infrastructure and the engineering decisions behind them."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://docs.beyouweb.com/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
